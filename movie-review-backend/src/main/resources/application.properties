spring.application.name=movie-review-backend

# MySQL Connection URL with auto-database creation flag
spring.datasource.url=jdbc:mysql://localhost:3306/review?createDatabaseIfNotExist=true&serverTimezone=UTC

# Database Credentials
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate DDL Auto-Creation for Tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE